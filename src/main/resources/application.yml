spring:
  application:
    name: ecommerce-payment-service
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

checkout:
  reservation-minutes: 10
  reconciliation:
    fixed-delay: 30000
    fast-attempts: 6

auto-delivery:
  discovery-cron: "0 0 1 * * *"
  zone: Australia/Sydney
